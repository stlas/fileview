  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#f0f6fc" stroke-opacity=".14" stroke-width="1.5"/>
  <!-- Document with folded corner -->
  <path d="M20 11H38L48 21V49A4 4 0 0 1 44 53H20A4 4 0 0 1 16 49V15A4 4 0 0 1 20 11Z" fill="#f0f6fc"/>
  <path d="M38 11V17A4 4 0 0 0 42 21H48Z" fill="#8b949e"/>
  <!-- Rendered content: a blue heading, two text lines -->
  <rect x="21" y="25" width="18" height="4.5" rx="2.25" fill="#58a6ff"/>
  <rect x="21" y="33" width="21" height="3" rx="1.5" fill="#8b949e"/>
  <rect x="21" y="39" width="12" height="3" rx="1.5" fill="#8b949e"/>
