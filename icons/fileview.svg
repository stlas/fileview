  <circle cx="45" cy="46" r="8" fill="#58a6ff"/>
  <circle cx="45" cy="46" r="3.4" fill="#0d1117"/>
  <circle cx="46.6" cy="44.4" r="1.2" fill="#f0f6fc"/>
</svg>
